global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "frappe-hrms-korea"
    environment: "production"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alerting rules
rule_files:
  - "/etc/prometheus/rules.yml"

# ---------------------------------------------------------------------------
# Scrape configurations
# ---------------------------------------------------------------------------
scrape_configs:

  # Frappe custom metrics exporter
  - job_name: "frappe_exporter"
    static_configs:
      - targets: ["frappe-exporter:9101"]
    scrape_interval: 15s
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Alertmanager
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  # Loki
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
    metrics_path: /metrics

  # Grafana
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics

  # Node exporter (optional — add if node-exporter service is running)
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]

  # MariaDB exporter (optional — add if mysqld-exporter is running)
  # - job_name: "mariadb"
  #   static_configs:
  #     - targets: ["mariadb-exporter:9104"]

  # Redis exporter (optional — add if redis-exporter is running)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
