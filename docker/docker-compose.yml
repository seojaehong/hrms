version: "3.8" # Updated version
services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      # 프로덕션은 docker/.env 의 MARIADB_ROOT_PASSWORD 로 주입 (기존 볼륨의 비번 변경은 mysqladmin 별도 절차)
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-123}
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: unless-stopped

  frappe:
    image: frappe/bench:latest
    restart: unless-stopped
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
    # v2 시맨틱 RAG 활성화 키(YELLOW_ENVELOPE_SUPABASE_URL/KEY, OPENAI_API_KEY)는
    # 호스트의 docker/frappe.env(600, git 비추적)로 주입 — 파일이 없으면 v1 폴백으로 무해.
    env_file:
      - path: ./frappe.env
        required: false
    working_dir: /home/frappe
    volumes:
      - bench-home:/home/frappe
      - .:/workspace
      - ..:/workspace/hrms-source
    expose:
      - "8001"
      - "9000"

  # S1 프로덕션 프런트: 에셋/업로드 정적 서빙 + gunicorn/socketio 프록시.
  # cloudflared(호스트) → localhost:8000 → nginx → frappe(gunicorn 8001).
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frappe
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - bench-home:/home/frappe:ro
    ports:
      - 8000:80

volumes:
  mariadb-data:
  bench-home:
