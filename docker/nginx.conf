# Korea HRMS S1 프로덕션 프런트 — 에셋/업로드 정적 서빙 + gunicorn/socketio 프록시.
# frappe 공식 nginx 템플릿 축약판 (multi-site: $host로 사이트 라우팅).

worker_processes 1;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 도메인 → Frappe 사이트명 매핑. 신규 테넌트는 사이트명=도메인이라 default로 충분.
    map $host $frappe_site {
        default          $host;
        hrms.safeclaw.kr hrms.localhost;
    }

    upstream frappe { server frappe:8001; }
    upstream socketio { server frappe:9000; }

    # SafeClaw HR 제품 랜딩 (정적) — 테넌트 아님
    server {
        listen 80;
        server_name hr.safeclaw.kr;
        root /home/frappe/frappe-bench/sites;
        location / { try_files /safeclaw-hr.html =404; }
    }

    server {
        listen 80 default_server;
        server_name _;

        root /home/frappe/frappe-bench/sites;

        location /assets {
            try_files $uri =404;
            add_header Cache-Control "max-age=31536000";
        }

        # 사이트별 공개 업로드 파일 (Host 헤더 → sites/<host>/public/files)
        location ~ ^/files/(.*)$ {
            try_files /$frappe_site/public/files/$1 =404;
        }

        location /socket.io {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Frappe-Site-Name $frappe_site;
            proxy_set_header Host $frappe_site;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://socketio;
        }

        location / {
            proxy_set_header Host $frappe_site;
            proxy_set_header X-Frappe-Site-Name $frappe_site;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120;
            proxy_pass http://frappe;
        }
    }
}
