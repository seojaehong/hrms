<!DOCTYPE html>
<html lang="ko-KR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>오프라인 — Korea HRMS</title>
  <!-- DESIGN_TOKEN_THEME_COLOR: #0066ff -->
  <meta name="theme-color" content="#0066ff" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* 디자인 토큰 — 2026-07 sprint에서 교체 */
      --color-primary: #0066ff;
      --color-primary-dark: #0052cc;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #1e293b;
      --color-muted: #64748b;
      --color-border: #e2e8f0;
    }

    html, body {
      height: 100%;
      background: var(--color-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--color-text);
    }

    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      gap: 1.5rem;
      text-align: center;
    }

    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrap svg {
      width: 40px;
      height: 40px;
      stroke: var(--color-primary);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 0.9375rem;
      color: var(--color-muted);
      line-height: 1.6;
      max-width: 320px;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      width: 100%;
      max-width: 360px;
      text-align: left;
    }

    .card-title {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .card-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-links a {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.625rem 0.75rem;
      border-radius: 0.625rem;
      background: var(--color-bg);
      color: var(--color-text);
      text-decoration: none;
      font-size: 0.9375rem;
      font-weight: 500;
      transition: background 0.15s;
    }

    .card-links a:hover { background: #eff6ff; }

    .card-links a svg {
      width: 18px;
      height: 18px;
      stroke: var(--color-primary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.625rem;
      background: var(--color-primary);
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--color-primary-dark); }

    .btn svg {
      width: 18px;
      height: 18px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.75rem;
      border-radius: 99px;
      background: #fef2f2;
      color: #dc2626;
      font-size: 0.8125rem;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dc2626;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- 아이콘 -->
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <path d="M1 6l5 5 5-5M1 12l5 5 5-5"/>
        <path d="M13 12h8M17 8l4 4-4 4"/>
      </svg>
    </div>

    <!-- 상태 배지 -->
    <div class="status-badge">
      <span class="status-dot"></span>
      오프라인
    </div>

    <h1>인터넷에 연결되어 있지 않아요</h1>

    <p>
      네트워크 연결을 확인해 주세요.<br>
      Wi-Fi 또는 모바일 데이터를 켜면<br>자동으로 다시 연결됩니다.
    </p>

    <!-- 캐시된 페이지 바로가기 -->
    <div class="card">
      <div class="card-title">오프라인에서 이용 가능한 메뉴</div>
      <div class="card-links">
        <a href="/hrms/home">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          홈
        </a>
        <a href="/hrms/dashboard/attendance">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          근태 현황
        </a>
        <a href="/hrms/dashboard/salary-slips">
          <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          급여명세서
        </a>
        <a href="/hrms/dashboard/leaves">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          휴가 현황
        </a>
      </div>
    </div>

    <!-- 새로고침 버튼 -->
    <button class="btn" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      다시 연결하기
    </button>

  </div>
</body>
</html>
