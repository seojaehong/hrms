# Hermes gateway 설정 템플릿 — 도구 잠금(tool lock-down)용
#
# 목적: 테넌트 노출 전, Hermes gateway 에이전트가 우리 tool_registry 밖의
#       자체 셸·파일시스템·브라우저 등 도구를 쓰지 못하도록 잠근다.
#       (배경: docs/korea_hrms/hermes-embedding.md §보안 발견 참조)
#
# 표기 규칙:
#   - 값이 있는 키 = 실동에서 경험적으로 확인된 사실.
#   - "TODO:" 주석 = 서버(claudebot-2 ~/workspaces/hermes-agent)의
#     toolsets.py / cli-config.yaml.example 를 조사한 뒤 확정할 항목.
#     추측값을 사실처럼 채우지 않는다. 확인 전에는 비워 둔다.
#
# 주의: 이 레포에는 Hermes 소스가 없다(vendor/HERMES_PIN 참조만).
#       레포 안에서 toolsets.py 를 찾으려 하지 말 것. 서버에서만 조사.

model:
  # 경험적으로 확인됨: gateway는 default 모델이 필요하다.
  # per-request 로 provider/model 을 주입하지만(llm_credentials.py 라우팅),
  # 요청이 model 을 지정하지 않을 때의 폴백으로 default 가 요구된다.
  default: "claude-sonnet-4-5"   # 운영 배포 시 플랫폼 표준 모델로 교체

# --- 도구 잠금 (미확정: 서버 조사 후 채움) ---
tools:
  # TODO: 서버에서 toolsets.py 를 조사해 아래를 확정한다.
  #   1) gateway 에이전트에 기본 활성화된 셸/파일/브라우저 툴셋의 정확한 키 이름.
  #   2) 그 툴셋을 비활성화(또는 allowlist 만 남기기)하는 설정 키의 이름·형식.
  #   3) cli-config.yaml.example 에 도구 관련 예시 키가 있는지.
  # 확정 전까지 아래는 값 없이 자리표시자만 둔다 — 추측 금지.
  #
  # enabled_toolsets:        # TODO: 실제 키 이름 확인
  #   - <TODO: 우리 tool_registry 경유만 허용하는 최소 셋>
  # disabled_toolsets:       # TODO: 셸/파일/브라우저 툴셋 키 확인 후 나열
  #   - <TODO: shell/filesystem/browser 툴셋 키>

# --- 참고 ---
# 잠금은 3중 방어의 한 축이다:
#   (1) 하네스 시스템 프롬프트의 외부 도구 금지 지시 (구현됨: US-1,
#       agent_harness/prompt_builder.py IMMUTABLE_DOMAIN_PRINCIPLES).
#   (2) 본 gateway 설정의 도구 잠금 (본 템플릿 — 서버 조사 후 확정).
#   (3) 서버 조사 TODO 완료 (toolsets.py / cli-config.yaml.example).

# ── 확정된 잠금 설정 (2026-07-10 라이브 검증) ───────────────────────────
# 동적 MCP 토올셋명 = "mcp-{서버명}" (tools/mcp_tool.py:4750)
# 검증: /v1/toolsets enabled=[] → mcp 등록 후 [mcp-korea_hrms]만.
# ⚠️ mcp SDK는 uv sync에 빠지는 옵션 의존성: uv pip install mcp 필요.
platform_toolsets:
  api_server: [mcp-korea_hrms]

mcp_servers:
  korea_hrms:
    url: http://127.0.0.1:8100/mcp
    headers:
      Authorization: "Bearer <issue_token.py로 발급한 계산전용 테넌트 토큰>"
